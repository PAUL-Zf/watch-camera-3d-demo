<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片查看器滚动验证</title><style>:root {
  font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #243346; background: #eef1f4; font-synthesis: none;
  --border: #dce3ea; --muted: #798494; --accent: #147d80;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 1px solid var(--border); background: #fff; border-radius: 6px; color: #405064; padding: 5px 9px; font-size: 11px; transition: background .15s, border .15s; }
button:hover { background: #edf7f7; border-color: #8ac2c1; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, .main-viewport:focus-visible, .feed:focus-visible { outline: 2px solid #42bcb6; outline-offset: 1px; }
h1, h2, p { margin: 0; }
h2 { font-size: 12px; line-height: 16px; letter-spacing: .1px; }
#renderLayer { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
#renderLayer canvas { display: block; width: 100%; height: 100%; }
.app { position: relative; z-index: 1; width: 100%; height: 100vh; height: 100dvh; display: grid; grid-template-rows: 56px minmax(0, 1fr) 24px; }
.topbar { background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 24px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: #173944; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
.brand-mark span { color: #46d7cf; font-size: 16px; }
.brand strong { font-size: 15px; letter-spacing: 1.5px; }
.brand strong span { font-weight: 300; color: #adc0c5; }
.brand small { display: block; font-size: 10px; letter-spacing: .7px; color: var(--muted); margin-top: 2px; }
.top-meta { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.offline { display: flex; align-items: center; font-size: 10px; gap: 6px; color: #147d80; background: #edf7f4; padding: 4px 8px; border-radius: 20px; white-space: nowrap; }
.offline i, .live-label i { width: 6px; height: 6px; border-radius: 50%; background: #3bbd98; }
.version { font-size: 9px; letter-spacing: 1px; color: #87939d; white-space: nowrap; }
.top-actions { display: flex; gap: 6px; white-space: nowrap; }
.dark-button { background: #243d47; color: white; border-color: #243d47; }
.dark-button:hover { background: #36545f; }
.workspace { display: grid; grid-template-columns: clamp(320px, 20vw, 360px) minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; padding: 10px 12px; width: 100%; min-width: 0; min-height: 0; }
/* Compact base: structured cards, bounded row heights, no distributed spacer. */
.control-panel { position: relative; padding: 6px; background: #e8eef2; border: 1px solid #d8e2e9; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 0; align-self: stretch; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
.control-guide { display: none; flex: none; align-items: center; justify-content: space-between; color: #416878; font-size: 12px; height: 24px; padding: 0 4px; }
.control-guide .guide-caption { color: #788b99; font-size: 11px; }
.control-guide i { font-style: normal; color: #90aab5; }
.control-section { padding: 2px; min-width: 0; flex: none; background: #fff; border: 1px solid #dce5eb; border-radius: 9px; }
.camera-section { border-top: 3px solid var(--selected-color, #46d7cf); }
.section-heading { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; height: 24px; }
.section-heading h2 { font-size: 14px; line-height: 20px; font-weight: 650; white-space: nowrap; color: #263e50; }
.section-title small { display: none; font-size: 11px; color: #82929f; line-height: 15px; margin-top: 2px; }
.step { font-size: 11px; font-weight: 650; background: #eaf5f3; color: #147d80; border-radius: 6px; padding: 4px; line-height: 14px; }
.watch-section .step { color: #56768a; background: #edf2f7; }
.camera-section .step { color: #5c698a; background: #eff0f8; }
.section-help { margin-left: auto; }
.section-help summary { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; list-style: none; cursor: pointer; border-radius: 50%; border: 1px solid #d3dde3; color: #617788; font-size: 12px; }
.section-help summary::-webkit-details-marker { display: none; }
.section-help summary:focus-visible { outline: 2px solid #42bcb6; }
.section-help[open] summary { color: #147d80; background: #eaf5f3; }
.section-help p { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 5; padding: 12px; background: #fff; border: 1px solid #cddce2; box-shadow: 0 6px 20px #17394426; border-radius: 8px; font-size: 13px; line-height: 1.7; color: #53687a; }
.wrist-row { display: flex; align-items: center; gap: 10px; height: 26px; margin-bottom: 4px; }
.field-label { font-size: 13px; color: #506578; white-space: nowrap; }
.segmented { display: flex; flex: 1; background: #eef2f4; padding: 2px; gap: 3px; border-radius: 6px; height: 26px; }
.segmented button { flex: 1; background: none; border: 0; padding: 0 4px; font-size: 13px; }
.segmented button.active { background: white; color: #147d80; box-shadow: 0 1px 3px #15273512; font-weight: 650; }
.pose-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 4px; }
.pose-list button { padding: 2px; height: 28px; text-align: center; font-size: 12px; white-space: nowrap; }
.pose-list button.active { border-color: #58a6a2; background: #eef9f7; color: #13746e; box-shadow: inset 0 -2px #58a6a233; }
.sliders { display: flex; flex-direction: column; gap: 1px; }
.slider-field { display: grid; grid-template-columns: 136px minmax(0, 1fr) 38px; gap: 8px; align-items: center; height: 22px; min-width: 0; }
.slider-heading { display: contents; }
.slider-heading label { grid-column: 1; grid-row: 1; font-size: 13px; line-height: 20px; color: #4c6276; white-space: nowrap; }
.slider-heading output { grid-column: 3; grid-row: 1; text-align: center; font-size: 13px; line-height: 20px; font-weight: 600; color: #315663; font-variant-numeric: tabular-nums; white-space: nowrap; border-radius: 5px; background: #edf5f5; }
.slider-track { grid-column: 2; grid-row: 1; position: relative; min-width: 0; }
.slider-field input { display: block; width: 100%; min-width: 0; margin: 0; accent-color: #238b87; height: 22px; cursor: pointer; }
.slider-bounds { display: none; }
.angle-shortcuts { display: flex; gap: 4px; margin-top: 4px; min-width: 0; }
.angle-shortcuts button { padding: 2px 3px; height: 24px; font-size: 12px; flex: 1; white-space: nowrap; }
.angle-shortcuts button.active { background: #e6f5f1; border-color: #84bbb6; color: #147d80; }
.camera-heading .enable-row { margin-left: auto; }
.camera-tabs { display: flex; gap: 5px; height: 28px; margin-bottom: 4px; }
.camera-tabs button { flex: 1; min-width: 0; border: 1px solid #dce5eb; border-bottom: 3px solid var(--cam-color); padding: 0 3px; font-size: 13px; background: #f6f9fb; }
.camera-tabs button.active { background: #fff; color: #183d49; border-color: var(--cam-color); box-shadow: 0 0 0 1px var(--cam-color); }
.slot-letter { display: flex; justify-content: center; align-items: center; gap: 6px; font-weight: 700; line-height: 17px; }
.slot-letter i { background: var(--cam-color); width: 6px; height: 6px; border-radius: 50%; }
.shortcut-caption { display: none; }
.slot-surface { display: none; font-size: 10px; font-weight: 400; line-height: 12px; color: #758b98; }
#cameraEditor { display: flex; flex-direction: column; }
.camera-mount-fields { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.select-row { display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 20px; color: #4c6276; min-width: 0; height: 26px; }
.select-row select { flex: 1; width: 0; min-width: 0; height: 26px; border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; background: #fafcfd; color: #33475b; font-size: 13px; }
.enable-row { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #506578; white-space: nowrap; margin: 0; }
.enable-row input { accent-color: #238b87; margin: 0; width: 13px; height: 13px; }
.camera-shortcuts { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
.camera-shortcuts > .angle-shortcuts { display: grid; grid-template-columns: 76px repeat(3, minmax(0, 1fr)); align-items: center; margin: 0; flex: none; }
.camera-shortcuts button { font-size: 12px; }
.camera-shortcuts .shortcut-caption { display: block; position: static; font-size: 12px; line-height: 18px; color: #597180; padding: 0; white-space: nowrap; }
.camera-default { width: 100%; font-size: 12px; height: 24px; padding: 2px; margin-top: 4px; background: #f7f9fb; }
.studio-panel, .camera-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.panel-top { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 1px 6px; gap: 6px; min-width: 0; }
.eyebrow { font-size: 8px; letter-spacing: 1.4px; color: #8c98a3; display: block; margin-bottom: 4px; }
.panel-top h1 { font-size: 18px; font-weight: 650; letter-spacing: -.3px; line-height: 21px; }
.panel-top h2 { font-size: 16px; font-weight: 650; line-height: 21px; }
.scene-badge, .aspect-label { font-size: 9px; color: #6b7d85; border: 1px solid #d4dfe2; padding: 4px 6px; border-radius: 5px; white-space: nowrap; }
.main-viewport { flex: 1; min-height: 0; position: relative; border-radius: 11px; overflow: hidden; border: 1px solid #35454f; touch-action: none; cursor: grab; background: transparent; }
.main-viewport:active { cursor: grabbing; }
.view-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; gap: 6px; z-index: 2; }
.live-label { font-size: 10px; color: #b7c9d1; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.view-buttons { display: flex; gap: 4px; pointer-events: auto; }
.view-buttons button { background: #1d333fe0; color: #bacbd4; border-color: #3b535e; font-size: 10px; padding: 4px 7px; }
.view-buttons button[aria-pressed="true"] { background: #2a625f; border-color: #78c7be; color: #effffa; }
.axis-note { position: absolute; left: 13px; top: 48px; font-size: 10px; color: #aac1ca; line-height: 1.7; pointer-events: none; }
.axis-note span { font-size: 9px; color: #748f9e; }
.view-help { position: absolute; top: 86px; left: 13px; color: #839daa; font-size: 9px; pointer-events: none; }
#loading { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: #1c2d38; color: #c3d4dd; font-size: 13px; padding: 20px; text-align: center; }
.studio-toolbar { flex: none; display: flex; align-items: center; gap: 9px; font-size: 10px; flex-wrap: wrap; padding: 5px 0 0; }
.studio-toolbar label { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.studio-toolbar input { accent-color: #228a84; margin: 0; }
.studio-toolbar button { margin-left: auto; font-size: 10px; padding: 4px 6px; }
.studio-toolbar button.active { background: #207f7b; color: white; border-color: #207f7b; }
#fps { color: #8b98a2; font-size: 9px; min-width: 35px; font-variant-numeric: tabular-nums; }
.viewport-status { position: absolute; left: 10px; right: 10px; bottom: 10px; pointer-events: none; }
.readout { flex: none; display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 8px 10px; background: #eff5f5e8; border: 1px solid #bfcfd799; border-radius: 8px; min-width: 0; }
.readout strong { font-size: 12px; }
.readout .eyebrow { margin-bottom: 3px; font-size: 7px; }
.readout-stat { white-space: nowrap; }
.readout-stat small { display: block; color: #85929e; font-size: 9px; margin-bottom: 3px; }
.readout-stat b { font-size: 10px; font-weight: 600; }
.explanation { flex: none; display: flex; gap: 8px; margin-top: 6px; font-size: 10px; line-height: 15px; padding: 7px 9px; color: #b6cbd4; background: #162c38dd; border-radius: 7px; }
.explanation b { white-space: nowrap; color: #91d7d1; }
.feeds { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
.feed { display: grid; grid-template-rows: 32px minmax(0, 1fr) 38px; border-radius: 9px; border: 1px solid #d4dfe5; overflow: hidden; background: transparent; cursor: pointer; min-width: 0; min-height: 0; }
.feed.selected { border-color: var(--cam-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cam-color), transparent 66%); }
.feed-header { padding: 5px 8px; display: flex; align-items: center; gap: 6px; background: #fff; min-width: 0; }
.cam-letter { background: var(--cam-color); color: #183340; width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 750; flex: none; }
.feed-title { font-size: 10px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-selection { margin-left: auto; color: #a6b3bd; font-size: 9px; }
.feed-frame { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
.camera-view { flex: none; aspect-ratio: 4/3; position: relative; background: transparent; overflow: hidden; }
.feed-crosshair { position: absolute; width: 14px; height: 14px; border: 1px solid #ffffff70; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.feed-crosshair:before, .feed-crosshair:after { content: ''; position: absolute; background: #ffffff70; }
.feed-crosshair:before { width: 1px; height: 20px; left: 6px; top: -4px; }
.feed-crosshair:after { height: 1px; width: 20px; top: 6px; left: -4px; }
.feed-fov { position: absolute; bottom: 6px; left: 6px; color: #dae4e8; background: #172c3bb8; border-radius: 3px; padding: 3px 4px; font-size: 8px; }
.feed-disabled { position: absolute; inset: 0; align-items: center; justify-content: center; display: none; background: #283842; color: #adbdc6; font-size: 11px; }
.feed.disabled .feed-disabled { display: flex; }
.feed-bottom { padding: 5px 7px; font-size: 9px; line-height: 12px; color: #81929e; background: #fff; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.feed-bottom span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.visibility-status { color: #3e7975; }
.feed-key { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 9px; color: #728491; margin: 7px 0; }
.feed-key span { display: flex; gap: 5px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.feed-key i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.camera-info { flex: none; border-top: 1px solid var(--border); padding-top: 6px; color: #8493a0; font-size: 10px; line-height: 15px; }
.camera-info b { color: #516775; font-size: 10px; }
.capture-button { flex: none; width: 100%; margin-top: 6px; border-color: #b3cfcd; background: #f5fbf9; color: #207d76; font-size: 11px; height: 29px; padding: 4px; }
.target-legend { flex: none; margin-top: 5px; font-size: 9px; color: #7d8d98; line-height: 13px; }
footer { padding: 0 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 9px; color: #8d99a4; min-width: 0; }
footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #203d49; color: #fff; border-radius: 8px; padding: 10px 18px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; font-size: 12px; max-width: 90vw; }
.toast-visible { opacity: 1 !important; }
/* Short laptop windows retain every control, without introducing a panel scrollbar. */
@media (max-height: 780px) {
  .studio-toolbar { gap: 7px; }
}
@media (max-height: 650px) {
  .app { grid-template-rows: 48px minmax(0, 1fr) 20px; }
  .workspace { padding: 6px 8px; gap: 8px; }
  .panel-top { height: 40px; padding-bottom: 5px; }
  .feed { grid-template-rows: 28px minmax(0, 1fr) 34px; }
  .feed-bottom { padding: 3px 6px; gap: 2px; }
  .explanation { margin-top: 4px; padding: 5px 7px; }
}
@media (max-width: 1250px) {
  .workspace { grid-template-columns: 320px minmax(0, 1.3fr) minmax(0, 1fr); gap: 9px; padding-left: 9px; padding-right: 9px; }
  .scene-badge { display: none; }
  .panel-top h1 { font-size: 16px; }
  .panel-top h2 { font-size: 14px; }
  .studio-toolbar { font-size: 9px; }
  .readout { gap: 6px; padding: 7px; }
  .readout-stat:last-child { white-space: normal; font-size: 9px; }
}
/* Narrow windows keep controls on the left and both view panels on the right. */
@media (max-width: 1000px) {
  .workspace { grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); }
  .control-panel { grid-row: 1 / span 2; }
  .studio-panel { grid-column: 2; grid-row: 1; }
  .camera-panel { grid-column: 2; grid-row: 2; }
  .feeds { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 5px; }
  .camera-panel .panel-top { height: 29px; padding-bottom: 4px; }
  .camera-panel .panel-top > div { display: flex; align-items: center; gap: 8px; }
  .camera-panel .eyebrow { margin-bottom: 0; font-size: 7px; }
  .camera-panel h2 { font-size: 12px; }
  .camera-info { padding-top: 3px; line-height: 12px; font-size: 9px; }
  .camera-info b { font-size: 9px; }
  .feed-key { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 4px 0; font-size: 8px; gap: 4px; }
  .feed-key span { text-overflow: ellipsis; }
  .feed-header { padding: 4px; gap: 3px; }
  .feed-selection { display: none; }
  .feed-title { font-size: 9px; }
  .feed-bottom { font-size: 8px; padding: 4px; }
  .cam-letter { width: 16px; height: 16px; font-size: 9px; }
  .version { display: none; }
  .explanation { padding: 4px 6px; font-size: 9px; line-height: 12px; }
  .readout { padding: 5px 7px; }
  .readout-stat small { margin-bottom: 1px; }
  .readout .eyebrow { margin-bottom: 1px; }
  .target-legend { margin-top: 3px; font-size: 8px; }
  .capture-button { height: 24px; margin-top: 3px; font-size: 10px; }
}
@media (max-width: 700px) {
  .workspace { grid-template-columns: 320px minmax(0, 1fr); gap: 6px; padding: 6px; }
  .topbar { gap: 8px; padding: 0 8px; }
  .brand strong { font-size: 12px; letter-spacing: .4px; }
  .brand small { font-size: 8px; letter-spacing: 0; }
  .brand-mark { width: 26px; height: 26px; font-size: 17px; }
  .top-meta { gap: 3px; }
  .offline { font-size: 8px; padding: 3px 5px; }
  .top-actions { gap: 3px; }
  .top-actions button { padding: 4px; font-size: 9px; }
  .feeds { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .feed { grid-template-rows: 23px minmax(0, 1fr) 30px; }
  .camera-panel .panel-top > div { display: block; }
  .camera-panel .panel-top { height: 36px; }
  .panel-top { height: 42px; }
  .panel-top h1, .panel-top h2 { font-size: 12px; line-height: 16px; }
  .view-top { top: 6px; left: 6px; right: 6px; flex-wrap: wrap; }
  .live-label { font-size: 8px; }
  .view-buttons button { font-size: 9px; padding: 3px; }
  .axis-note { font-size: 8px; left: 6px; }
  .view-help { font-size: 7px; left: 6px; }
  .studio-toolbar { gap: 4px; font-size: 8px; padding: 4px 0; }
  .studio-toolbar button { font-size: 8px; padding: 3px; }
  .readout strong { font-size: 10px; }
  .readout-stat b, .readout-stat small { font-size: 8px; }
  .explanation { gap: 4px; font-size: 8px; }
  .feed-key { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .camera-info, .target-legend { font-size: 8px; line-height: 11px; }
  .camera-info b { font-size: 8px; }
  .aspect-label { font-size: 8px; padding: 3px; }
  footer { font-size: 8px; padding: 0 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Use extra height for richer hierarchy rather than stretching slider rows. */
@media (min-height: 900px) {
  .control-panel { padding: 8px; gap: 8px; }
  .control-guide { display: none; }
  .control-section { padding: 5px; }
  .slider-field, .slider-field input { height: 24px; }
  .pose-list button { height: 30px; }
  .camera-tabs { height: 34px; margin-bottom: 6px; }
  .slot-surface { display: block; }
  .select-row, .select-row select, .wrist-row, .segmented { height: 28px; }
  .angle-shortcuts button, .camera-default { height: 26px; }
}
@media (min-height: 1080px) {
  .control-panel { padding: 8px; gap: 8px; }
  .control-guide { display: flex; }
  .control-section { padding: 5px; box-shadow: 0 2px 6px #1b3f4a05; }
  .section-heading { height: 36px; margin-bottom: 6px; }
  .section-title small { display: block; }
  .section-heading h2 { font-size: 15px; }
  .wrist-row, .segmented { height: 32px; }
  .wrist-row, .pose-list, .camera-mount-fields { margin-bottom: 6px; }
  .pose-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
